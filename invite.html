<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>You're invited · Bachata Factory Helsinki</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="page">
    <div id="content">
      <p class="muted">Loading your invitation&hellip;</p>
    </div>
  </main>

  <script type="module">
    import { getDancerByToken, updateOwnName, getPublicStats } from "./js/data.js";
    import { escapeHtml, getQueryParam, nominationDeadlineMs, formatCountdown, NOMINATION_PERIOD_DEADLINE_MS } from "./js/util.js";

    const content = document.getElementById("content");
    const token = getQueryParam("t");

    // Navigating back here from nominate.html can restore the old cached page (with
    // stale nomination counts) instead of re-running this script — force a fresh load.
    window.addEventListener("pageshow", (e) => {
      if (e.persisted) location.reload();
    });

    function renderNotFound() {
      content.innerHTML = `
        <h1>Invite not found</h1>
        <div class="notice error">
          This invite link isn't valid, or it may have expired. If you think this is a mistake,
          get in touch with the Administrator directly.
        </div>
        <p><a class="button secondary" href="index.html">All info here</a></p>
      `;
    }

    function counterClass(count) {
      return count >= 5 ? "counter--done" : "counter--pending";
    }

    const clockIcon = `<svg class="counter-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>`;
    const tickboxIcon = `<svg class="counter-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"></rect><polyline points="7 12 10.5 16 17 8"></polyline></svg>`;

    function renderInvite(dancer, stats, token) {
      const sentCount = dancer.sentNominationCount || 0;
      const sentNames = dancer.sentNominatedNames || [];
      const nameParts = (dancer.name || "").trim().split(/\s+/);
      const firstGuess = nameParts[0] || "";
      const lastGuess = nameParts.slice(1).join(" ");
      content.innerHTML = `
        <h1>Hello ${escapeHtml(dancer.name)}, you have been nominated</h1>
        <p class="tagline tagline--tight">You're invited to Bachata Factory Helsinki, a peer-driven project for bachata dancers.</p>
        <p class="countdown-box" id="countdown-box"></p>
        <div class="card">
          <div class="stats-row">
            <div class="stat">
              <span class="stat-number">${stats.nomineeCount}</span>
              <span class="stat-label">Nominees</span>
            </div>
            <div class="stat">
              <span class="stat-number">${stats.totalNominations}</span>
              <span class="stat-label">Total nominations</span>
            </div>
            <div class="stat">
              <span class="stat-number stat-number--countdown" id="period-countdown"></span>
              <span class="stat-label">The nomination period ends in:</span>
            </div>
          </div>
        </div>
        <div class="card">
          <p>
            Someone who's already part of this circle nominated you personally. This isn't a
            public event; your spot is reserved because they wanted you there.
          </p>
          <p class="muted">BFH runs weekly in Vallila starting mid-September.</p>
          <a class="button secondary" href="index.html">All info here</a>
        </div>
        <div class="steps">
          <div class="step">
            <div class="step-icon">
              <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 5h18v14H3z"></path>
                <path d="m3 5 9 7 9-7"></path>
                <path d="M12 15.6c-1.9-1.4-3.1-2.5-3.1-3.9a1.8 1.8 0 0 1 3.1-1.2 1.8 1.8 0 0 1 3.1 1.2c0 1.4-1.2 2.5-3.1 3.9z" fill="currentColor" stroke="none"></path>
              </svg>
            </div>
            <p class="step-label">Get invited</p>
            <p class="step-desc">You've been personally invited by someone already in the circle.</p>
          </div>
          <div class="step-arrow" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="12" x2="20" y2="12"></line><polyline points="14 6 20 12 14 18"></polyline></svg>
          </div>
          <div class="step">
            <div class="step-icon">
              <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                <path d="M2 5.5A2.5 2.5 0 0 1 4.5 3h9A2.5 2.5 0 0 1 16 5.5v6a2.5 2.5 0 0 1-2.5 2.5H8l-3.5 3v-3H4.5A2.5 2.5 0 0 1 2 11.5z"></path>
                <line x1="5" y1="7" x2="12" y2="7"></line>
                <line x1="5" y1="9.5" x2="10" y2="9.5"></line>
                <circle cx="17.5" cy="6.5" r="2.8" fill="currentColor" stroke="none"></circle>
                <line x1="17.5" y1="1.3" x2="17.5" y2="2.4"></line>
                <line x1="21.1" y1="2.9" x2="20.3" y2="3.7"></line>
                <line x1="22.5" y1="6.5" x2="21.4" y2="6.5"></line>
                <line x1="13.9" y1="2.9" x2="14.7" y2="3.7"></line>
              </svg>
            </div>
            <p class="step-label">Recommend dancers</p>
            <p class="step-desc">Nominate 5&ndash;10 dancers you'd gladly get feedback from.</p>
          </div>
          <div class="step-arrow" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="12" x2="20" y2="12"></line><polyline points="14 6 20 12 14 18"></polyline></svg>
          </div>
          <div class="step">
            <div class="step-icon">
              <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                <defs>
                  <clipPath id="flagClip">
                    <path d="M4 3c3-1.6 5 1.6 8 0s5 1.6 8 0v9c-3 1.6-5-1.6-8 0s-5-1.6-8 0z"></path>
                  </clipPath>
                </defs>
                <line x1="4" y1="2" x2="4" y2="22"></line>
                <path d="M4 3c3-1.6 5 1.6 8 0s5 1.6 8 0v9c-3 1.6-5-1.6-8 0s-5-1.6-8 0z"></path>
                <g clip-path="url(#flagClip)" fill="currentColor" stroke="none">
                  <rect x="4" y="3" width="2.7" height="2.7"></rect>
                  <rect x="9.3" y="3" width="2.7" height="2.7"></rect>
                  <rect x="14.6" y="3" width="2.7" height="2.7"></rect>
                  <rect x="19.9" y="3" width="2.7" height="2.7"></rect>
                  <rect x="6.6" y="5.7" width="2.7" height="2.7"></rect>
                  <rect x="11.9" y="5.7" width="2.7" height="2.7"></rect>
                  <rect x="17.2" y="5.7" width="2.7" height="2.7"></rect>
                  <rect x="4" y="8.4" width="2.7" height="2.7"></rect>
                  <rect x="9.3" y="8.4" width="2.7" height="2.7"></rect>
                  <rect x="14.6" y="8.4" width="2.7" height="2.7"></rect>
                  <rect x="19.9" y="8.4" width="2.7" height="2.7"></rect>
                </g>
              </svg>
            </div>
            <p class="step-label">Wait for the deadline</p>
            <p class="step-desc">Wait until the third week of August to receive more info and final invitation.</p>
          </div>
        </div>
        <div class="card">
          <p class="muted">To help the organizers, please insert your full name</p>
          <form id="name-form">
            <div class="name-form-row">
              <input type="text" id="firstName" placeholder="First Name" value="${escapeHtml(firstGuess)}" required />
              <input type="text" id="lastName" placeholder="Last Name" value="${escapeHtml(lastGuess)}" required />
            </div>
            <div class="actions">
              <button type="submit">Save</button>
            </div>
          </form>
          <div id="name-message"></div>
        </div>
        <div class="card">
          <h2 style="font-size: 1.2rem">From whom would you gladly take feedback?</h2>
          <p class="muted">Nominate minimum 5 (max 10) dancers to automatically receive updates and express your desire in participating in the group. Multiple nomination of the same person are part of the game, don't worry about it.</p>
          <p>
            <span class="counter-group ${counterClass(sentCount)}">
              <span class="counter">${sentCount}</span>
              ${sentCount >= 5 ? tickboxIcon : clockIcon}
            </span>
            <span class="muted">/ 10 nominated</span>
          </p>
          ${
            sentNames.length
              ? `<ul class="nominator-list">${sentNames.map((n) => `<li>${escapeHtml(n)}</li>`).join("")}</ul>`
              : `<p class="muted">You haven't nominated anyone yet.</p>`
          }
          ${
            sentCount >= 10
              ? `<p class="muted">You've reached the maximum of 10 nominations.</p>`
              : `<a class="button" href="nominate.html?from=${encodeURIComponent(token)}">Nominate someone</a>`
          }
        </div>
      `;

      const deadlineMs = nominationDeadlineMs(dancer.approvedAt);
      const countdownBox = document.getElementById("countdown-box");
      let countdownTimer;
      function renderCountdown() {
        if (deadlineMs === null) {
          countdownBox.style.display = "none";
          return;
        }
        const remaining = formatCountdown(deadlineMs);
        if (!remaining) {
          countdownBox.className = "countdown-box expired";
          countdownBox.textContent = "Your 48-hour nomination window has closed.";
          clearInterval(countdownTimer);
          return;
        }
        if (sentCount >= 5) {
          countdownBox.className = "countdown-box done";
          countdownBox.innerHTML = `You've nominated ${sentCount} &mdash; you're all set. Window closes in <strong>${remaining}</strong>.`;
        } else {
          countdownBox.className = "countdown-box";
          countdownBox.innerHTML = `You have <strong>${remaining}</strong> left to nominate at least 5 dancers.`;
        }
      }
      renderCountdown();
      countdownTimer = setInterval(renderCountdown, 1000);

      const periodEl = document.getElementById("period-countdown");
      let periodTimer;
      function renderPeriodCountdown() {
        const remaining = formatCountdown(NOMINATION_PERIOD_DEADLINE_MS);
        periodEl.textContent = remaining || "Closed";
        if (!remaining) clearInterval(periodTimer);
      }
      renderPeriodCountdown();
      periodTimer = setInterval(renderPeriodCountdown, 1000);

      document.getElementById("name-form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const firstName = document.getElementById("firstName").value;
        const lastName = document.getElementById("lastName").value;
        const messageEl = document.getElementById("name-message");
        const submitBtn = e.target.querySelector("button[type=submit]");

        submitBtn.disabled = true;
        try {
          await updateOwnName(token, firstName, lastName);
          messageEl.innerHTML = `<div class="notice success">Saved, thank you!</div>`;
        } catch (err) {
          messageEl.innerHTML = `<div class="notice error">Something went wrong: ${escapeHtml(err.message)}</div>`;
        }
        submitBtn.disabled = false;
      });
    }

    if (!token) {
      renderNotFound();
    } else {
      Promise.all([
        getDancerByToken(token),
        getPublicStats().catch(() => ({ nomineeCount: 0, totalNominations: 0 })),
      ])
        .then(([dancer, stats]) => {
          if (!dancer || dancer.status !== "approved") {
            renderNotFound();
          } else {
            renderInvite(dancer, stats, token);
          }
        })
        .catch(() => renderNotFound());
    }
  </script>
</body>
</html>
