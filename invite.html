<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>You're invited · Bachata Factory Helsinki</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="page">
    <div id="content">
      <p class="muted">Loading your invitation&hellip;</p>
    </div>
  </main>

  <script type="module">
    import { getDancerByToken, updateOwnName } from "./js/data.js";
    import { escapeHtml, getQueryParam } from "./js/util.js";

    const content = document.getElementById("content");
    const token = getQueryParam("t");

    // Navigating back here from nominate.html can restore the old cached page (with
    // stale nomination counts) instead of re-running this script — force a fresh load.
    window.addEventListener("pageshow", (e) => {
      if (e.persisted) location.reload();
    });

    function renderNotFound() {
      content.innerHTML = `
        <h1>Invite not found</h1>
        <div class="notice error">
          This invite link isn't valid, or it may have expired. If you think this is a mistake,
          get in touch with the Administrator directly.
        </div>
        <p><a class="button secondary" href="index.html">Discover more</a></p>
      `;
    }

    function counterClass(count) {
      if (count >= 10) return "counter--full";
      if (count >= 5) return "counter--mid";
      return "counter--low";
    }

    function renderInvite(dancer, token) {
      const sentCount = dancer.sentNominationCount || 0;
      const sentNames = dancer.sentNominatedNames || [];
      const nameParts = (dancer.name || "").trim().split(/\s+/);
      const firstGuess = nameParts[0] || "";
      const lastGuess = nameParts.slice(1).join(" ");
      content.innerHTML = `
        <h1>Hello ${escapeHtml(dancer.name)}, you have been nominated</h1>
        <p class="tagline">You're invited to Bachata Factory Helsinki, a peer-driven project for bachata dancers.</p>
        <div class="card">
          <p>
            Someone who's already part of this circle nominated you personally. This isn't a
            public event; your spot is reserved because they wanted you there.
          </p>
          <p class="muted">BFH runs weekly in Vallila starting mid-September.</p>
          <a class="button secondary" href="index.html">Discover more</a>
        </div>
        <div class="card">
          <p class="muted">To help the organizers, please insert your full name</p>
          <form id="name-form">
            <div class="name-form-row">
              <input type="text" id="firstName" placeholder="First Name" value="${escapeHtml(firstGuess)}" required />
              <input type="text" id="lastName" placeholder="Last Name" value="${escapeHtml(lastGuess)}" required />
            </div>
            <div class="actions">
              <button type="submit">Save</button>
            </div>
          </form>
          <div id="name-message"></div>
        </div>
        <div class="card">
          <h2 style="font-size: 1.2rem">Know someone who belongs here too?</h2>
          <p class="muted">You can nominate between 5 and 10 dancers. Here's how you're doing so far:</p>
          <p>
            <span class="counter ${counterClass(sentCount)}">${sentCount}</span>
            <span class="muted">/ 10 nominated</span>
          </p>
          ${
            sentNames.length
              ? `<ul class="nominator-list">${sentNames.map((n) => `<li>${escapeHtml(n)}</li>`).join("")}</ul>`
              : `<p class="muted">You haven't nominated anyone yet.</p>`
          }
          ${
            sentCount >= 10
              ? `<p class="muted">You've reached the maximum of 10 nominations.</p>`
              : `<a class="button" href="nominate.html?from=${encodeURIComponent(token)}">Nominate someone</a>`
          }
        </div>
      `;

      document.getElementById("name-form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const firstName = document.getElementById("firstName").value;
        const lastName = document.getElementById("lastName").value;
        const messageEl = document.getElementById("name-message");
        const submitBtn = e.target.querySelector("button[type=submit]");

        submitBtn.disabled = true;
        try {
          await updateOwnName(token, firstName, lastName);
          messageEl.innerHTML = `<div class="notice success">Saved, thank you!</div>`;
        } catch (err) {
          messageEl.innerHTML = `<div class="notice error">Something went wrong: ${escapeHtml(err.message)}</div>`;
        }
        submitBtn.disabled = false;
      });
    }

    if (!token) {
      renderNotFound();
    } else {
      getDancerByToken(token)
        .then((dancer) => {
          if (!dancer || dancer.status !== "approved") {
            renderNotFound();
          } else {
            renderInvite(dancer, token);
          }
        })
        .catch(() => renderNotFound());
    }
  </script>
</body>
</html>
