<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bachata Factory Helsinki</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <section class="hero" id="hero">
    <canvas id="hero-canvas" class="hero-canvas" aria-hidden="true"></canvas>
    <div class="hero-vignette"></div>
    <div class="hero-loading">Loading&hellip;</div>

    <div class="hero-overlay">
      <div class="hero-brand">Bachata Factory Helsinki</div>
      <p class="hero-prompt" id="hero-prompt">Take your bachata steps in correct order</p>
    </div>

    <div class="hero-dial" id="hero-dial"></div>
  </section>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="js/medusa-points.js"></script>
  <script src="js/hero-medusa.js"></script>
  <script src="js/hero-dial.js"></script>
</body>
</html>
