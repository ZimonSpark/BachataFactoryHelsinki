<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Team calendar · Bachata Factory Helsinki</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="page">
    <nav class="top">
      <a href="admin.html">&larr; Admin</a>
      <span id="who"></span>
    </nav>
    <h1>Team calendar</h1>
    <p class="muted">Friday sessions only, 18 Sep &ndash; 27 Nov 2026.</p>
    <div id="content">
      <p class="muted">Loading&hellip;</p>
    </div>
  </main>

  <script type="module">
    import {
      MOCK_MODE,
      onAdminAuthChange,
      signInAdmin,
      signOutAdmin,
      listAllDancers,
      listCalendarAttendance,
      setFridayAttendance,
      setFridayNotes,
    } from "./js/data.js";
    import { escapeHtml, listFridays, formatFridayLabel, formatMonthLabel } from "./js/util.js";

    const content = document.getElementById("content");
    const who = document.getElementById("who");

    window.addEventListener("pageshow", (e) => {
      if (e.persisted) location.reload();
    });

    function roleCounts(participants) {
      const leaders = participants.filter((d) => d.role === "L").length;
      const followers = participants.filter((d) => d.role === "F").length;
      const both = participants.filter((d) => d.role === "LF").length;
      return { leaders, followers, both };
    }

    function participantListHtml(date, list) {
      if (!list.length) return `<p class="muted">None scheduled.</p>`;
      return `<ul class="nominator-list">${list
        .map(
          (d) => `<li>
            <span>${escapeHtml(d.name)}${d.role ? ` (${escapeHtml(d.role)})` : ""}</span>
            <button class="secondary icon-button" data-remove-participant="${date}" data-token="${escapeHtml(d.id)}" aria-label="Remove ${escapeHtml(d.name)}">&times;</button>
          </li>`
        )
        .join("")}</ul>`;
    }

    function fridayCard(date, participantTokens, notes, dancerByToken, allDancers, isOpen) {
      const participants = participantTokens.map((t) => dancerByToken.get(t)).filter(Boolean);
      const teamParticipants = participants.filter((d) => d.inTeam);
      const guestParticipants = participants.filter((d) => !d.inTeam);
      const { leaders, followers, both } = roleCounts(participants);
      const availableToAdd = allDancers
        .filter((d) => !participantTokens.includes(d.id))
        .sort((a, b) => a.name.localeCompare(b.name));

      return `
        <div class="friday-row" data-date="${date}">
          <details${isOpen ? " open" : ""}>
            <summary>
              <span class="friday-date">${formatFridayLabel(date)}</span>
              <span class="friday-count">Team members: ${teamParticipants.length} &middot; Guests: ${guestParticipants.length}</span>
              <span class="role-counts">L ${leaders} &middot; F ${followers} &middot; LF ${both}</span>
            </summary>
            <div class="details-body">
              <p class="muted" style="margin-top: 0">Team members</p>
              ${participantListHtml(date, teamParticipants)}

              <p class="muted" style="margin-top: 1rem">Guests</p>
              ${participantListHtml(date, guestParticipants)}

              <div class="nominator-add-row">
                <input
                  type="text"
                  list="dancerOptions-${date}"
                  data-add-input="${date}"
                  placeholder="Search a dancer&hellip;"
                  autocomplete="off"
                />
                <datalist id="dancerOptions-${date}">
                  ${availableToAdd
                    .map(
                      (d) =>
                        `<option value="${escapeHtml(d.name)}">${escapeHtml(d.name)}${d.role ? ` (${escapeHtml(d.role)})` : ""}${d.inTeam ? "" : " &mdash; guest"}</option>`
                    )
                    .join("")}
                </datalist>
                <button class="secondary" data-add-participant="${date}">Add</button>
              </div>

              <label for="fridayNotes-${date}">Notes</label>
              <textarea id="fridayNotes-${date}" rows="3">${escapeHtml(notes)}</textarea>
              <div class="actions">
                <button class="secondary" data-save-friday-notes="${date}">Save notes</button>
              </div>
            </div>
          </details>
        </div>
      `;
    }

    async function renderCalendar({ showLoading = true } = {}) {
      const scrollY = window.scrollY;
      const openDates = new Set(
        [...content.querySelectorAll(".friday-row")]
          .filter((row) => row.querySelector("details")?.open)
          .map((row) => row.dataset.date)
      );

      if (showLoading) {
        content.innerHTML = `<p class="muted">Loading&hellip;</p>`;
      }
      const [dancers, attendanceMap] = await Promise.all([listAllDancers(), listCalendarAttendance()]);
      const dancerByToken = new Map(dancers.map((d) => [d.id, d]));
      const teamTokens = dancers.filter((d) => d.inTeam).map((d) => d.id);

      const fridays = listFridays();
      const months = [];
      fridays.forEach((date) => {
        const label = formatMonthLabel(date);
        let group = months.find((m) => m.label === label);
        if (!group) {
          group = { label, dates: [] };
          months.push(group);
        }
        group.dates.push(date);
      });

      const effective = {};
      const effectiveNotes = {};
      fridays.forEach((date) => {
        effective[date] = attendanceMap[date]?.participants ?? teamTokens;
        effectiveNotes[date] = attendanceMap[date]?.notes ?? "";
      });

      content.innerHTML = `
        ${MOCK_MODE ? `<div class="notice info">Local preview mode: showing mock data, nothing is saved.</div>` : ""}
        ${months
          .map(
            (month) => `
              <div class="card">
                <h2 style="font-size:1.2rem">${month.label}</h2>
                ${month.dates.map((date) => fridayCard(date, effective[date], effectiveNotes[date], dancerByToken, dancers, openDates.has(date))).join("")}
              </div>
            `
          )
          .join("")}
      `;
      window.scrollTo(0, scrollY);

      content.querySelectorAll("[data-remove-participant]").forEach((btn) => {
        btn.addEventListener("click", async () => {
          const date = btn.dataset.removeParticipant;
          const token = btn.dataset.token;
          const updated = effective[date].filter((t) => t !== token);
          btn.disabled = true;
          await setFridayAttendance(date, updated);
          renderCalendar({ showLoading: false });
        });
      });
      content.querySelectorAll("[data-add-participant]").forEach((btn) => {
        btn.addEventListener("click", async () => {
          const date = btn.dataset.addParticipant;
          const input = content.querySelector(`[data-add-input="${date}"]`);
          const typedName = input.value.trim();
          if (!typedName) return;
          const match = dancers.find((d) => !effective[date].includes(d.id) && d.name === typedName);
          if (!match) return;
          const updated = [...effective[date], match.id];
          btn.disabled = true;
          await setFridayAttendance(date, updated);
          renderCalendar({ showLoading: false });
        });
      });
      content.querySelectorAll("[data-save-friday-notes]").forEach((btn) => {
        btn.addEventListener("click", async () => {
          const date = btn.dataset.saveFridayNotes;
          const textarea = document.getElementById(`fridayNotes-${date}`);
          btn.disabled = true;
          await setFridayNotes(date, textarea.value);
          renderCalendar({ showLoading: false });
        });
      });
    }

    function renderSignedOut() {
      content.innerHTML = `
        <div class="card">
          <p>Sign in with the admin Google account to manage the team calendar.</p>
          <button id="signin">Sign in with Google</button>
        </div>
      `;
      document.getElementById("signin").addEventListener("click", () => signInAdmin().catch((err) => alert(err.message)));
    }

    function renderUnauthorized(email) {
      content.innerHTML = `
        <div class="notice error">Signed in as ${escapeHtml(email)}, which isn't the admin account.</div>
        <button id="signout" class="secondary">Sign out</button>
      `;
      document.getElementById("signout").addEventListener("click", () => signOutAdmin());
    }

    if (MOCK_MODE) {
      who.textContent = "local preview";
      renderCalendar();
    } else {
      onAdminAuthChange(({ signedIn, isAdmin, email }) => {
        if (!signedIn) {
          who.textContent = "";
          renderSignedOut();
        } else if (!isAdmin) {
          who.textContent = email;
          renderUnauthorized(email);
        } else {
          who.innerHTML = `${escapeHtml(email)} &middot; <a href="#" id="signout-link">sign out</a>`;
          document.getElementById("signout-link")?.addEventListener("click", (e) => {
            e.preventDefault();
            signOutAdmin();
          });
          renderCalendar();
        }
      });
    }
  </script>
</body>
</html>
