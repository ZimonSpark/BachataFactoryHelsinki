<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin · Bachata Factory Helsinki</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="page">
    <nav class="top">
      <a href="index.html">&larr; Bachata Factory Helsinki</a>
      <span id="who"></span>
    </nav>
    <h1>Admin</h1>
    <div id="content">
      <p class="muted">Loading&hellip;</p>
    </div>
  </main>

  <script type="module">
    import {
      MOCK_MODE,
      onAdminAuthChange,
      signInAdmin,
      signOutAdmin,
      listAllDancers,
      approveDancer,
      addNominator,
      removeLatestNominator,
      removeNominatorAt,
      addDancerManually,
      deleteDancer,
      setContacted,
    } from "./js/data.js";
    import { escapeHtml, formatDate } from "./js/util.js";

    const content = document.getElementById("content");
    const who = document.getElementById("who");

    function inviteUrl(token) {
      return `${location.origin}${location.pathname.replace(/admin\.html$/, "")}invite.html?t=${encodeURIComponent(token)}`;
    }

    function dancerRow(d) {
      const approved = d.status === "approved";
      const nominators = d.receivedNominators || [];
      return `
        <div class="dancer-row" data-token="${escapeHtml(d.id)}">
          <div class="dancer-row-main">
            <span class="status-icon" title="${approved ? "Approved" : "Pending"}">${approved ? "&#9989;" : "&#9203;"}</span>
            <strong class="dancer-name">${escapeHtml(d.name)}</strong>
            <span class="badge">${nominators.length}</span>
            <button
              class="secondary icon-button contact-toggle${d.contacted ? " contacted" : ""}"
              data-contact="${escapeHtml(d.id)}"
              data-contacted="${d.contacted ? "true" : "false"}"
              aria-label="${d.contacted ? "Mark as not contacted" : "Mark as contacted"}"
              title="${d.contacted ? "Contacted" : "Not contacted yet"}"
            >
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="2" width="10" height="20" rx="2"></rect><line x1="11" y1="18" x2="13" y2="18"></line></svg>
            </button>
            <button class="secondary" data-copy="${inviteUrl(d.id)}">Copy link</button>
            ${!approved ? `<button data-approve="${escapeHtml(d.id)}">Approve</button>` : ""}
            <button class="secondary icon-button" data-delete="${escapeHtml(d.id)}" data-name-key="${escapeHtml(d.nameKey || "")}" aria-label="Delete nomination" title="Delete nomination">&#128465;</button>
          </div>
          <details>
            <summary>Details</summary>
            <div class="details-body">
              <p class="muted">Contact: ${escapeHtml(d.contact)}</p>
              <p class="invite-link">${inviteUrl(d.id)}</p>

              <label for="nomInput-${escapeHtml(d.id)}">Nominator name</label>
              <div class="nominator-add-row">
                <input type="text" id="nomInput-${escapeHtml(d.id)}" placeholder="e.g. Maria Lopez" />
                <button class="secondary" data-add-nominator="${escapeHtml(d.id)}" aria-label="Add nominator">+</button>
                <button class="secondary" data-remove-latest="${escapeHtml(d.id)}" aria-label="Remove latest nominator">&minus;</button>
                <button class="secondary icon-button" data-toggle-edit="${escapeHtml(d.id)}" aria-label="Manage nominators" title="Manage nominators">&#128295;</button>
              </div>

              ${
                nominators.length
                  ? `<ul class="nominator-list" data-nominator-list="${escapeHtml(d.id)}">${nominators
                      .map(
                        (n, i) => `<li>
                          <span>${escapeHtml(n.name)} &middot; ${formatDate(n.timestamp)}</span>
                          <button class="secondary icon-button edit-only" data-remove-index="${escapeHtml(d.id)}" data-index="${i}" aria-label="Remove this nominator">&times;</button>
                        </li>`
                      )
                      .join("")}</ul>`
                  : `<p class="muted">No nominators on record.</p>`
              }
            </div>
          </details>
        </div>
      `;
    }

    async function renderDashboard() {
      content.innerHTML = `<p class="muted">Loading dancers&hellip;</p>`;
      const dancers = await listAllDancers();

      content.innerHTML = `
        ${MOCK_MODE ? `<div class="notice info">Local preview mode: showing mock data, nothing is saved.</div>` : ""}
        <div class="card">
          <h2 style="font-size:1.2rem">Nominated dancers</h2>
          ${dancers.length ? dancers.map(dancerRow).join("") : `<p class="muted">No one has been nominated yet.</p>`}
        </div>
        <div class="card">
          <h2 style="font-size:1.2rem">Add a dancer manually</h2>
          <p class="muted">Use this to seed the first invites, since nominating requires an existing invite.</p>
          <form id="seed-form">
            <label for="seedName">Name</label>
            <input type="text" id="seedName" required />
            <label for="seedContact">Email or phone</label>
            <input type="text" id="seedContact" required />
            <div class="actions">
              <button type="submit">Create invite</button>
            </div>
          </form>
          <div id="seed-message"></div>
        </div>
      `;

      content.querySelectorAll("[data-approve]").forEach((btn) => {
        btn.addEventListener("click", async () => {
          btn.disabled = true;
          await approveDancer(btn.dataset.approve);
          renderDashboard();
        });
      });
      content.querySelectorAll("[data-add-nominator]").forEach((btn) => {
        btn.addEventListener("click", async () => {
          const token = btn.dataset.addNominator;
          const input = document.getElementById(`nomInput-${token}`);
          if (!input.value.trim()) return;
          btn.disabled = true;
          await addNominator(token, input.value);
          renderDashboard();
        });
      });
      content.querySelectorAll("[data-remove-latest]").forEach((btn) => {
        btn.addEventListener("click", async () => {
          btn.disabled = true;
          await removeLatestNominator(btn.dataset.removeLatest);
          renderDashboard();
        });
      });
      content.querySelectorAll("[data-remove-index]").forEach((btn) => {
        btn.addEventListener("click", async () => {
          btn.disabled = true;
          await removeNominatorAt(btn.dataset.removeIndex, Number(btn.dataset.index));
          renderDashboard();
        });
      });
      content.querySelectorAll("[data-toggle-edit]").forEach((btn) => {
        btn.addEventListener("click", () => {
          const list = content.querySelector(`[data-nominator-list="${btn.dataset.toggleEdit}"]`);
          list?.classList.toggle("editing");
        });
      });
      content.querySelectorAll("[data-contact]").forEach((btn) => {
        btn.addEventListener("click", async () => {
          const nowContacted = btn.dataset.contacted !== "true";
          btn.disabled = true;
          await setContacted(btn.dataset.contact, nowContacted);
          renderDashboard();
        });
      });
      content.querySelectorAll("[data-copy]").forEach((btn) => {
        btn.addEventListener("click", async () => {
          const text = btn.dataset.copy;
          const originalLabel = btn.textContent;
          try {
            if (navigator.clipboard) {
              await navigator.clipboard.writeText(text);
            } else {
              // Clipboard API needs a secure context (HTTPS); fall back for plain HTTP.
              const tmp = document.createElement("textarea");
              tmp.value = text;
              tmp.style.position = "fixed";
              tmp.style.opacity = "0";
              document.body.appendChild(tmp);
              tmp.select();
              document.execCommand("copy");
              document.body.removeChild(tmp);
            }
            btn.textContent = "Copied!";
          } catch {
            btn.textContent = "Copy failed, select manually";
          }
          setTimeout(() => { btn.textContent = originalLabel; }, 1500);
        });
      });
      content.querySelectorAll("[data-delete]").forEach((btn) => {
        btn.addEventListener("click", async () => {
          if (btn.dataset.armed === "true") {
            clearTimeout(Number(btn.dataset.armTimer));
            btn.disabled = true;
            await deleteDancer(btn.dataset.delete, btn.dataset.nameKey);
            renderDashboard();
            return;
          }
          btn.dataset.armed = "true";
          btn.classList.add("danger-armed");
          btn.dataset.armTimer = String(
            setTimeout(() => {
              btn.dataset.armed = "false";
              btn.classList.remove("danger-armed");
            }, 2000)
          );
        });
      });

      document.getElementById("seed-form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const name = document.getElementById("seedName").value;
        const contact = document.getElementById("seedContact").value;
        try {
          const token = await addDancerManually({ name, contact });
          await renderDashboard();
          document.getElementById("seed-message").innerHTML = `<div class="notice success">Created invite for ${escapeHtml(name)}: <span class="invite-link">${inviteUrl(token)}</span></div>`;
        } catch (err) {
          document.getElementById("seed-message").innerHTML = `<div class="notice error">${escapeHtml(err.message)}</div>`;
        }
      });
    }

    function renderSignedOut() {
      content.innerHTML = `
        <div class="card">
          <p>Sign in with the admin Google account to manage nominations.</p>
          <button id="signin">Sign in with Google</button>
        </div>
      `;
      document.getElementById("signin").addEventListener("click", () => signInAdmin().catch((err) => alert(err.message)));
    }

    function renderUnauthorized(email) {
      content.innerHTML = `
        <div class="notice error">Signed in as ${escapeHtml(email)}, which isn't the admin account.</div>
        <button id="signout" class="secondary">Sign out</button>
      `;
      document.getElementById("signout").addEventListener("click", () => signOutAdmin());
    }

    if (MOCK_MODE) {
      who.textContent = "local preview";
      renderDashboard();
    } else {
      onAdminAuthChange(({ signedIn, isAdmin, email }) => {
        if (!signedIn) {
          who.textContent = "";
          renderSignedOut();
        } else if (!isAdmin) {
          who.textContent = email;
          renderUnauthorized(email);
        } else {
          who.innerHTML = `${escapeHtml(email)} &middot; <a href="#" id="signout-link">sign out</a>`;
          document.getElementById("signout-link")?.addEventListener("click", (e) => {
            e.preventDefault();
            signOutAdmin();
          });
          renderDashboard();
        }
      });
    }
  </script>
</body>
</html>
