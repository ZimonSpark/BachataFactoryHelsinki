<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin · Bachata Factory Helsinki</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="page">
    <nav class="top">
      <a href="index.html">&larr; Bachata Factory Helsinki</a>
      <span id="who"></span>
    </nav>
    <h1>Admin</h1>
    <div id="content">
      <p class="muted">Loading&hellip;</p>
    </div>
  </main>

  <script type="module">
    import {
      MOCK_MODE,
      onAdminAuthChange,
      signInAdmin,
      signOutAdmin,
      listAllDancers,
      approveDancer,
      addNominator,
      removeLatestNominator,
      removeNominatorAt,
      resetNominationTimer,
      addDancerManually,
      deleteDancer,
      setContacted,
      setQualifiedOverride,
      setFlaggedRed,
      setInTeam,
      listNameChangeLog,
    } from "./js/data.js";
    import { escapeHtml, formatDate, nominationDeadlineMs, formatCountdown } from "./js/util.js";

    const content = document.getElementById("content");
    const who = document.getElementById("who");

    window.addEventListener("pageshow", (e) => {
      if (e.persisted) location.reload();
    });

    function inviteUrl(token) {
      // Built from a fixed root path rather than the current URL — admin.html can be
      // reached as "/admin" (no extension) via GitHub Pages' clean-URL serving, which
      // broke naive path-stripping (produced "/admininvite.html").
      return `${location.origin}/invite.html?t=${encodeURIComponent(token)}`;
    }

    function adminCountdownText(deadlineMs, sentCount) {
      const remaining = formatCountdown(deadlineMs);
      if (!remaining) {
        return `Nomination window closed${sentCount < 5 ? ` &mdash; only ${sentCount}/5 nominated` : ""}.`;
      }
      return sentCount >= 5
        ? `${remaining} left &middot; already qualified (${sentCount} nominated)`
        : `${remaining} left &middot; ${sentCount}/5 nominated`;
    }

    function dancerRow(d) {
      const approved = d.status === "approved";
      const nominators = d.receivedNominators || [];
      const sentNames = d.sentNominatedNames || [];
      const sentCount = d.sentNominationCount || 0;
      const qualifiedGreen = typeof d.qualifiedOverride === "boolean" ? d.qualifiedOverride : sentCount >= 5;
      const flaggedRed = !!d.flaggedRed;
      const inTeam = !!d.inTeam;
      const deadlineMs = approved ? nominationDeadlineMs(d.approvedAt) : null;
      return `
        <div class="dancer-row" data-token="${escapeHtml(d.id)}">
          <div class="dancer-row-main">
            ${
              approved
                ? `<span class="status-icon" title="Approved">&#9989;</span>`
                : `<button
                    class="status-toggle"
                    data-toggle-pending="${escapeHtml(d.id)}"
                    data-flagged="${flaggedRed ? "true" : "false"}"
                    aria-label="${flaggedRed ? "Flagged — click to show hourglass" : "Pending — click to flag red"}"
                    title="${flaggedRed ? "Flagged" : "Pending"} &middot; click to toggle"
                  >${flaggedRed ? "&#10060;" : "&#9203;"}</button>`
            }
            <strong class="dancer-name">${escapeHtml(d.name)}</strong>
            <button
              class="badge qualified-badge ${qualifiedGreen ? "qualified-green" : "qualified-red"}"
              data-toggle-qualified="${escapeHtml(d.id)}"
              title="${sentCount}/10 sent &middot; click to toggle green/red"
            >${nominators.length}</button>
            <button
              class="secondary icon-button contact-toggle${d.contacted ? " contacted" : ""}"
              data-contact="${escapeHtml(d.id)}"
              data-contacted="${d.contacted ? "true" : "false"}"
              aria-label="${d.contacted ? "Mark as not contacted" : "Mark as contacted"}"
              title="${d.contacted ? "Contacted" : "Not contacted yet"}"
            >
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="2" width="10" height="20" rx="2"></rect><line x1="11" y1="18" x2="13" y2="18"></line></svg>
            </button>
            <button class="secondary" data-copy="${inviteUrl(d.id)}">Copy link</button>
            ${!approved ? `<button data-approve="${escapeHtml(d.id)}">Approve</button>` : ""}
            <button class="secondary icon-button" data-delete="${escapeHtml(d.id)}" data-name-key="${escapeHtml(d.nameKey || "")}" aria-label="Delete nomination" title="Delete nomination">&#128465;</button>
          </div>
          <details>
            <summary>Details</summary>
            <div class="details-body">
              ${
                deadlineMs !== null
                  ? `<div class="countdown-row">
                      <p class="countdown-admin${formatCountdown(deadlineMs) ? "" : " expired"}" data-deadline="${deadlineMs}" data-sent-count="${sentCount}">${adminCountdownText(deadlineMs, sentCount)}</p>
                      <button class="secondary icon-button" data-reset-timer="${escapeHtml(d.id)}" aria-label="Reset 48-hour timer" title="Reset 48-hour timer">
                        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"></polyline><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path></svg>
                      </button>
                    </div>`
                  : `<p class="muted">Countdown starts once approved.</p>`
              }
              <p class="muted">Contact: ${escapeHtml(d.contact)}</p>
              <p class="invite-link">${inviteUrl(d.id)}</p>

              <label for="nomInput-${escapeHtml(d.id)}">Nominator name</label>
              <div class="nominator-add-row">
                <input type="text" id="nomInput-${escapeHtml(d.id)}" placeholder="e.g. Maria Lopez" />
                <button class="secondary" data-add-nominator="${escapeHtml(d.id)}" aria-label="Add nominator">+</button>
                <button class="secondary" data-remove-latest="${escapeHtml(d.id)}" aria-label="Remove latest nominator">&minus;</button>
                <button class="secondary icon-button" data-toggle-edit="${escapeHtml(d.id)}" aria-label="Manage nominators" title="Manage nominators">&#128295;</button>
              </div>

              ${
                nominators.length
                  ? `<ul class="nominator-list" data-nominator-list="${escapeHtml(d.id)}">${nominators
                      .map(
                        (n, i) => `<li>
                          <span>${escapeHtml(n.name)} &middot; ${formatDate(n.timestamp)}</span>
                          <button class="secondary icon-button edit-only" data-remove-index="${escapeHtml(d.id)}" data-index="${i}" aria-label="Remove this nominator">&times;</button>
                        </li>`
                      )
                      .join("")}</ul>`
                  : `<p class="muted">No nominators on record.</p>`
              }

              <p class="muted" style="margin-top: 1rem">Nominated by them: ${sentCount}/10</p>
              ${
                sentNames.length
                  ? `<ul class="nominator-list">${sentNames.map((n) => `<li>${escapeHtml(n)}</li>`).join("")}</ul>`
                  : `<p class="muted">Hasn't nominated anyone yet.</p>`
              }

              ${
                approved
                  ? `<div class="actions">
                      <button class="team-toggle${inTeam ? " in-team" : ""}" data-toggle-team="${escapeHtml(d.id)}">${inTeam ? "&#10003; Team" : "Team"}</button>
                    </div>`
                  : ""
              }
            </div>
          </details>
        </div>
      `;
    }

    function nameLogRow(entry) {
      return `
        <li>
          ${formatDate(entry.timestamp)} &middot; ${escapeHtml(entry.oldName || "(none)")} &rarr; ${escapeHtml(entry.newName)}
          <span class="muted">(${escapeHtml(entry.token)})</span>
        </li>
      `;
    }

    async function renderDashboard({ showLoading = true } = {}) {
      if (showLoading) {
        content.innerHTML = `<p class="muted">Loading dancers&hellip;</p>`;
      }
      const [dancers, nameLog] = await Promise.all([listAllDancers(), listNameChangeLog()]);
      const scrollY = window.scrollY;

      const totalCount = dancers.length;
      const waitingApprovalCount = dancers.filter((d) => d.status !== "approved" && !d.flaggedRed).length;
      const waitingConnectionCount = dancers.filter((d) => !d.contacted && !d.flaggedRed).length;
      const teamDancers = dancers.filter((d) => d.inTeam);
      const pendingDancers = dancers.filter((d) => !d.inTeam && d.status !== "approved");
      const approvedDancers = dancers.filter((d) => !d.inTeam && d.status === "approved");

      content.innerHTML = `
        ${MOCK_MODE ? `<div class="notice info">Local preview mode: showing mock data, nothing is saved.</div>` : ""}
        <div class="card">
          <div class="stats-row">
            <div class="stat">
              <span class="stat-number">${totalCount}</span>
              <span class="stat-label">Total nominations</span>
            </div>
            <div class="stat">
              <span class="stat-number">${waitingApprovalCount}</span>
              <span class="stat-label">Waiting for approval</span>
            </div>
            <div class="stat">
              <span class="stat-number">${waitingConnectionCount}</span>
              <span class="stat-label">Waiting for connection</span>
            </div>
          </div>
        </div>
        <div class="card">
          <h2 style="font-size:1.2rem">Dancers in the team</h2>
          ${teamDancers.length ? teamDancers.map(dancerRow).join("") : `<p class="muted">No dancers in the team yet.</p>`}
        </div>
        <div class="card">
          <h2 style="font-size:1.2rem">Nomination waiting for approval</h2>
          ${pendingDancers.length ? pendingDancers.map(dancerRow).join("") : `<p class="muted">No nominations waiting for approval.</p>`}
        </div>
        <div class="card">
          <h2 style="font-size:1.2rem">Nominated dancers</h2>
          ${approvedDancers.length ? approvedDancers.map(dancerRow).join("") : `<p class="muted">No approved dancers yet.</p>`}
        </div>
        <div class="card">
          <details>
            <summary style="font-size:1.2rem">Name change log${nameLog.length ? ` (${nameLog.length})` : ""}</summary>
            <div class="details-body">
              ${
                nameLog.length
                  ? `<ul class="nominator-list">${nameLog.map(nameLogRow).join("")}</ul>`
                  : `<p class="muted">No name changes yet.</p>`
              }
            </div>
          </details>
        </div>
        <div class="card">
          <h2 style="font-size:1.2rem">Add a dancer manually</h2>
          <p class="muted">Use this to seed the first invites, since nominating requires an existing invite.</p>
          <form id="seed-form">
            <label for="seedName">Name</label>
            <input type="text" id="seedName" required />
            <label for="seedContact">Email or phone</label>
            <input type="text" id="seedContact" required />
            <div class="actions">
              <button type="submit">Create invite</button>
            </div>
          </form>
          <div id="seed-message"></div>
        </div>
      `;
      window.scrollTo(0, scrollY);

      content.querySelectorAll("[data-approve]").forEach((btn) => {
        btn.addEventListener("click", async () => {
          btn.disabled = true;
          await approveDancer(btn.dataset.approve);
          renderDashboard({ showLoading: false });
        });
      });
      content.querySelectorAll("[data-toggle-team]").forEach((btn) => {
        btn.addEventListener("click", async () => {
          const nowInTeam = !btn.classList.contains("in-team");
          btn.disabled = true;
          await setInTeam(btn.dataset.toggleTeam, nowInTeam);
          renderDashboard({ showLoading: false });
        });
      });
      content.querySelectorAll("[data-add-nominator]").forEach((btn) => {
        btn.addEventListener("click", async () => {
          const token = btn.dataset.addNominator;
          const input = document.getElementById(`nomInput-${token}`);
          if (!input.value.trim()) return;
          btn.disabled = true;
          await addNominator(token, input.value);
          renderDashboard({ showLoading: false });
        });
      });
      content.querySelectorAll("[data-toggle-pending]").forEach((btn) => {
        btn.addEventListener("click", async () => {
          const nowFlagged = btn.dataset.flagged !== "true";
          btn.disabled = true;
          await setFlaggedRed(btn.dataset.togglePending, nowFlagged);
          renderDashboard({ showLoading: false });
        });
      });
      content.querySelectorAll("[data-toggle-qualified]").forEach((btn) => {
        btn.addEventListener("click", async () => {
          const currentlyGreen = btn.classList.contains("qualified-green");
          btn.disabled = true;
          await setQualifiedOverride(btn.dataset.toggleQualified, !currentlyGreen);
          renderDashboard({ showLoading: false });
        });
      });
      content.querySelectorAll("[data-reset-timer]").forEach((btn) => {
        btn.addEventListener("click", async () => {
          btn.disabled = true;
          await resetNominationTimer(btn.dataset.resetTimer);
          renderDashboard({ showLoading: false });
        });
      });
      content.querySelectorAll("[data-remove-latest]").forEach((btn) => {
        btn.addEventListener("click", async () => {
          btn.disabled = true;
          await removeLatestNominator(btn.dataset.removeLatest);
          renderDashboard({ showLoading: false });
        });
      });
      content.querySelectorAll("[data-remove-index]").forEach((btn) => {
        btn.addEventListener("click", async () => {
          btn.disabled = true;
          await removeNominatorAt(btn.dataset.removeIndex, Number(btn.dataset.index));
          renderDashboard({ showLoading: false });
        });
      });
      content.querySelectorAll("[data-toggle-edit]").forEach((btn) => {
        btn.addEventListener("click", () => {
          const list = content.querySelector(`[data-nominator-list="${btn.dataset.toggleEdit}"]`);
          list?.classList.toggle("editing");
        });
      });
      content.querySelectorAll("[data-contact]").forEach((btn) => {
        btn.addEventListener("click", async () => {
          const nowContacted = btn.dataset.contacted !== "true";
          btn.disabled = true;
          await setContacted(btn.dataset.contact, nowContacted);
          renderDashboard({ showLoading: false });
        });
      });
      content.querySelectorAll("[data-copy]").forEach((btn) => {
        btn.addEventListener("click", async () => {
          const text = btn.dataset.copy;
          const originalLabel = btn.textContent;
          try {
            if (navigator.clipboard) {
              await navigator.clipboard.writeText(text);
            } else {
              // Clipboard API needs a secure context (HTTPS); fall back for plain HTTP.
              const tmp = document.createElement("textarea");
              tmp.value = text;
              tmp.style.position = "fixed";
              tmp.style.opacity = "0";
              document.body.appendChild(tmp);
              tmp.select();
              document.execCommand("copy");
              document.body.removeChild(tmp);
            }
            btn.textContent = "Copied!";
          } catch {
            btn.textContent = "Copy failed, select manually";
          }
          setTimeout(() => { btn.textContent = originalLabel; }, 1500);
        });
      });
      content.querySelectorAll("[data-delete]").forEach((btn) => {
        btn.addEventListener("click", async () => {
          if (btn.dataset.armed === "true") {
            clearTimeout(Number(btn.dataset.armTimer));
            btn.disabled = true;
            await deleteDancer(btn.dataset.delete, btn.dataset.nameKey);
            renderDashboard({ showLoading: false });
            return;
          }
          btn.dataset.armed = "true";
          btn.classList.add("danger-armed");
          btn.dataset.armTimer = String(
            setTimeout(() => {
              btn.dataset.armed = "false";
              btn.classList.remove("danger-armed");
            }, 2000)
          );
        });
      });

      document.getElementById("seed-form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const name = document.getElementById("seedName").value;
        const contact = document.getElementById("seedContact").value;
        try {
          const token = await addDancerManually({ name, contact });
          await renderDashboard({ showLoading: false });
          document.getElementById("seed-message").innerHTML = `<div class="notice success">Created invite for ${escapeHtml(name)}: <span class="invite-link">${inviteUrl(token)}</span></div>`;
        } catch (err) {
          document.getElementById("seed-message").innerHTML = `<div class="notice error">${escapeHtml(err.message)}</div>`;
        }
      });
    }

    function renderSignedOut() {
      content.innerHTML = `
        <div class="card">
          <p>Sign in with the admin Google account to manage nominations.</p>
          <button id="signin">Sign in with Google</button>
        </div>
      `;
      document.getElementById("signin").addEventListener("click", () => signInAdmin().catch((err) => alert(err.message)));
    }

    function renderUnauthorized(email) {
      content.innerHTML = `
        <div class="notice error">Signed in as ${escapeHtml(email)}, which isn't the admin account.</div>
        <button id="signout" class="secondary">Sign out</button>
      `;
      document.getElementById("signout").addEventListener("click", () => signOutAdmin());
    }

    // Queries the live DOM each tick rather than caching nodes, so it stays correct across
    // the full re-renders that every admin action (approve, add nominator, delete...) triggers.
    setInterval(() => {
      content.querySelectorAll("[data-deadline]").forEach((el) => {
        const deadlineMs = Number(el.dataset.deadline);
        const sentCount = Number(el.dataset.sentCount || 0);
        el.textContent = adminCountdownText(deadlineMs, sentCount);
        el.classList.toggle("expired", !formatCountdown(deadlineMs));
      });
    }, 1000);

    if (MOCK_MODE) {
      who.textContent = "local preview";
      renderDashboard();
    } else {
      onAdminAuthChange(({ signedIn, isAdmin, email }) => {
        if (!signedIn) {
          who.textContent = "";
          renderSignedOut();
        } else if (!isAdmin) {
          who.textContent = email;
          renderUnauthorized(email);
        } else {
          who.innerHTML = `${escapeHtml(email)} &middot; <a href="#" id="signout-link">sign out</a>`;
          document.getElementById("signout-link")?.addEventListener("click", (e) => {
            e.preventDefault();
            signOutAdmin();
          });
          renderDashboard();
        }
      });
    }
  </script>
</body>
</html>
