<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin — Bachata Factory Helsinki</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="page">
    <nav class="top">
      <a href="index.html">&larr; Bachata Factory Helsinki</a>
      <span id="who"></span>
    </nav>
    <h1>Admin</h1>
    <div id="content">
      <p class="muted">Loading&hellip;</p>
    </div>
  </main>

  <script type="module">
    import {
      MOCK_MODE,
      onAdminAuthChange,
      signInAdmin,
      signOutAdmin,
      listAllDancers,
      approveDancer,
      adjustReceivedCount,
      addDancerManually,
    } from "./js/data.js";
    import { escapeHtml, formatDate } from "./js/util.js";

    const content = document.getElementById("content");
    const who = document.getElementById("who");

    function inviteUrl(token) {
      return `${location.origin}${location.pathname.replace(/admin\.html$/, "")}invite.html?t=${encodeURIComponent(token)}`;
    }

    function dancerRow(d) {
      const approved = d.status === "approved";
      const nominators = d.receivedNominators || [];
      return `
        <div class="dancer-row" data-token="${escapeHtml(d.id)}">
          <div class="dancer-row-main">
            <span class="status-icon" title="${approved ? "Approved" : "Pending"}">${approved ? "&#9989;" : "&#9203;"}</span>
            <strong class="dancer-name">${escapeHtml(d.name)}</strong>
            <span class="count-control">
              <button class="secondary" data-decr="${escapeHtml(d.id)}" aria-label="Decrease nominations">&minus;</button>
              <span class="badge">${d.receivedNominationCount || 0}</span>
              <button class="secondary" data-incr="${escapeHtml(d.id)}" aria-label="Increase nominations">+</button>
            </span>
            <button class="secondary" data-copy="${inviteUrl(d.id)}">Copy link</button>
            ${!approved ? `<button data-approve="${escapeHtml(d.id)}">Approve</button>` : ""}
          </div>
          <details>
            <summary>Details</summary>
            <div class="details-body">
              <p class="muted">${escapeHtml(d.contact)}</p>
              <p class="invite-link">${inviteUrl(d.id)}</p>
              ${
                nominators.length
                  ? `<ul class="nominator-list">${nominators.map((n) => `<li>${escapeHtml(n.name)} &middot; ${formatDate(n.timestamp)}</li>`).join("")}</ul>`
                  : `<p class="muted">No nominators on record.</p>`
              }
            </div>
          </details>
        </div>
      `;
    }

    async function renderDashboard() {
      content.innerHTML = `<p class="muted">Loading dancers&hellip;</p>`;
      const dancers = await listAllDancers();

      content.innerHTML = `
        ${MOCK_MODE ? `<div class="notice info">Local preview mode &mdash; showing mock data, nothing is saved.</div>` : ""}
        <div class="card">
          <h2 style="font-size:1.2rem">Nominated dancers</h2>
          ${dancers.length ? dancers.map(dancerRow).join("") : `<p class="muted">No one has been nominated yet.</p>`}
        </div>
        <div class="card">
          <h2 style="font-size:1.2rem">Add a dancer manually</h2>
          <p class="muted">Use this to seed the first invites, since nominating requires an existing invite.</p>
          <form id="seed-form">
            <label for="seedName">Name</label>
            <input type="text" id="seedName" required />
            <label for="seedContact">Email or phone</label>
            <input type="text" id="seedContact" required />
            <div class="actions">
              <button type="submit">Create invite</button>
            </div>
          </form>
          <div id="seed-message"></div>
        </div>
      `;

      content.querySelectorAll("[data-approve]").forEach((btn) => {
        btn.addEventListener("click", async () => {
          btn.disabled = true;
          await approveDancer(btn.dataset.approve);
          renderDashboard();
        });
      });
      content.querySelectorAll("[data-incr]").forEach((btn) => {
        btn.addEventListener("click", async () => {
          btn.disabled = true;
          await adjustReceivedCount(btn.dataset.incr, 1);
          renderDashboard();
        });
      });
      content.querySelectorAll("[data-decr]").forEach((btn) => {
        btn.addEventListener("click", async () => {
          btn.disabled = true;
          await adjustReceivedCount(btn.dataset.decr, -1);
          renderDashboard();
        });
      });
      content.querySelectorAll("[data-copy]").forEach((btn) => {
        btn.addEventListener("click", async () => {
          const text = btn.dataset.copy;
          const originalLabel = btn.textContent;
          try {
            if (navigator.clipboard) {
              await navigator.clipboard.writeText(text);
            } else {
              // Clipboard API needs a secure context (HTTPS); fall back for plain HTTP.
              const tmp = document.createElement("textarea");
              tmp.value = text;
              tmp.style.position = "fixed";
              tmp.style.opacity = "0";
              document.body.appendChild(tmp);
              tmp.select();
              document.execCommand("copy");
              document.body.removeChild(tmp);
            }
            btn.textContent = "Copied!";
          } catch {
            btn.textContent = "Copy failed — select manually";
          }
          setTimeout(() => { btn.textContent = originalLabel; }, 1500);
        });
      });

      document.getElementById("seed-form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const name = document.getElementById("seedName").value;
        const contact = document.getElementById("seedContact").value;
        try {
          const token = await addDancerManually({ name, contact });
          await renderDashboard();
          document.getElementById("seed-message").innerHTML = `<div class="notice success">Created invite for ${escapeHtml(name)}: <span class="invite-link">${inviteUrl(token)}</span></div>`;
        } catch (err) {
          document.getElementById("seed-message").innerHTML = `<div class="notice error">${escapeHtml(err.message)}</div>`;
        }
      });
    }

    function renderSignedOut() {
      content.innerHTML = `
        <div class="card">
          <p>Sign in with the admin Google account to manage nominations.</p>
          <button id="signin">Sign in with Google</button>
        </div>
      `;
      document.getElementById("signin").addEventListener("click", () => signInAdmin().catch((err) => alert(err.message)));
    }

    function renderUnauthorized(email) {
      content.innerHTML = `
        <div class="notice error">Signed in as ${escapeHtml(email)}, which isn't the admin account.</div>
        <button id="signout" class="secondary">Sign out</button>
      `;
      document.getElementById("signout").addEventListener("click", () => signOutAdmin());
    }

    if (MOCK_MODE) {
      who.textContent = "local preview";
      renderDashboard();
    } else {
      onAdminAuthChange(({ signedIn, isAdmin, email }) => {
        if (!signedIn) {
          who.textContent = "";
          renderSignedOut();
        } else if (!isAdmin) {
          who.textContent = email;
          renderUnauthorized(email);
        } else {
          who.innerHTML = `${escapeHtml(email)} &middot; <a href="#" id="signout-link">sign out</a>`;
          document.getElementById("signout-link")?.addEventListener("click", (e) => {
            e.preventDefault();
            signOutAdmin();
          });
          renderDashboard();
        }
      });
    }
  </script>
</body>
</html>
