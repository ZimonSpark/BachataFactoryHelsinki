<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin · Bachata Factory Helsinki</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="page">
    <nav class="top">
      <a href="index.html">&larr; Bachata Factory Helsinki</a>
      <span id="who"></span>
    </nav>
    <h1>Admin</h1>
    <p>
      <a href="calendar.html" class="subnav-link">Team calendar &rarr;</a>
      &middot;
      <a href="interested.html" class="subnav-link">Interested people list &rarr;</a>
    </p>
    <div id="content">
      <p class="muted">Loading&hellip;</p>
    </div>
  </main>

  <script type="module">
    import {
      MOCK_MODE,
      onAdminAuthChange,
      signInAdmin,
      signOutAdmin,
      listAllDancers,
      refreshPublicStats,
      addDancerManually,
      listNameChangeLog,
    } from "./js/data.js";
    import { escapeHtml, formatDate } from "./js/util.js";
    import { dancerRow, inviteUrl, wireDancerRowHandlers, startCountdownTicker } from "./js/dancer-row.js";

    const content = document.getElementById("content");
    const who = document.getElementById("who");

    window.addEventListener("pageshow", (e) => {
      if (e.persisted) location.reload();
    });

    function nameLogRow(entry) {
      return `
        <li>
          ${formatDate(entry.timestamp)} &middot; ${escapeHtml(entry.oldName || "(none)")} &rarr; ${escapeHtml(entry.newName)}
          <span class="muted">(${escapeHtml(entry.token)})</span>
        </li>
      `;
    }

    async function renderDashboard({ showLoading = true } = {}) {
      if (showLoading) {
        content.innerHTML = `<p class="muted">Loading dancers&hellip;</p>`;
      }
      const [dancers, nameLog] = await Promise.all([listAllDancers(), listNameChangeLog()]);
      const scrollY = window.scrollY;

      refreshPublicStats(dancers).catch((err) => console.error("Failed to refresh public stats", err));

      const totalCount = dancers.length;
      const totalNominations = dancers.reduce((sum, d) => sum + (d.receivedNominationCount || 0), 0);
      const waitingApprovalCount = dancers.filter((d) => d.status !== "approved" && !d.flaggedRed).length;
      const waitingConnectionCount = dancers.filter((d) => !d.contacted && !d.flaggedRed).length;
      const leaderCount = dancers.filter((d) => d.role === "L").length;
      const followerCount = dancers.filter((d) => d.role === "F").length;
      const bothCount = dancers.filter((d) => d.role === "LF").length;
      const teamDancers = dancers.filter((d) => d.inTeam);
      const teamLeaderCount = teamDancers.filter((d) => d.role === "L").length;
      const teamFollowerCount = teamDancers.filter((d) => d.role === "F").length;
      const teamBothCount = teamDancers.filter((d) => d.role === "LF").length;
      const pendingDancers = dancers.filter((d) => !d.inTeam && d.status !== "approved");
      const approvedDancers = dancers.filter((d) => !d.inTeam && d.status === "approved");

      content.innerHTML = `
        ${MOCK_MODE ? `<div class="notice info">Local preview mode: showing mock data, nothing is saved.</div>` : ""}
        <div class="card">
          <div class="stats-row stats-row--4">
            <div class="stat">
              <span class="stat-number">${totalCount}</span>
              <span class="stat-label">Total nominees</span>
            </div>
            <div class="stat">
              <span class="stat-number">${totalNominations}</span>
              <span class="stat-label">Total nominations</span>
            </div>
            <div class="stat">
              <span class="stat-number">${waitingApprovalCount}</span>
              <span class="stat-label">Waiting for approval</span>
            </div>
            <div class="stat">
              <span class="stat-number">${waitingConnectionCount}</span>
              <span class="stat-label">Waiting for connection</span>
            </div>
            <div class="stat">
              <span class="stat-number">${leaderCount}</span>
              <span class="stat-label">Leaders</span>
            </div>
            <div class="stat">
              <span class="stat-number">${followerCount}</span>
              <span class="stat-label">Followers</span>
            </div>
            <div class="stat">
              <span class="stat-number">${bothCount}</span>
              <span class="stat-label">Both</span>
            </div>
          </div>
        </div>
        <div class="card">
          <h2 style="font-size:1.2rem">Dancers in the team</h2>
          <div class="stats-row stats-row--4">
            <div class="stat">
              <span class="stat-number">${teamDancers.length}</span>
              <span class="stat-label">Total in team</span>
            </div>
            <div class="stat">
              <span class="stat-number">${teamLeaderCount}</span>
              <span class="stat-label">Leaders</span>
            </div>
            <div class="stat">
              <span class="stat-number">${teamFollowerCount}</span>
              <span class="stat-label">Followers</span>
            </div>
            <div class="stat">
              <span class="stat-number">${teamBothCount}</span>
              <span class="stat-label">Both</span>
            </div>
          </div>
          ${teamDancers.length ? teamDancers.map(dancerRow).join("") : `<p class="muted">No dancers in the team yet.</p>`}
        </div>
        <div class="card">
          <h2 style="font-size:1.2rem">Nomination waiting for approval</h2>
          ${pendingDancers.length ? pendingDancers.map(dancerRow).join("") : `<p class="muted">No nominations waiting for approval.</p>`}
        </div>
        <div class="card">
          <h2 style="font-size:1.2rem">Nominated dancers</h2>
          ${approvedDancers.length ? approvedDancers.map(dancerRow).join("") : `<p class="muted">No approved dancers yet.</p>`}
        </div>
        <div class="card">
          <details>
            <summary style="font-size:1.2rem">Name change log${nameLog.length ? ` (${nameLog.length})` : ""}</summary>
            <div class="details-body">
              ${
                nameLog.length
                  ? `<ul class="nominator-list">${nameLog.map(nameLogRow).join("")}</ul>`
                  : `<p class="muted">No name changes yet.</p>`
              }
            </div>
          </details>
        </div>
        <div class="card">
          <h2 style="font-size:1.2rem">Add a dancer manually</h2>
          <p class="muted">Use this to seed the first invites, since nominating requires an existing invite.</p>
          <form id="seed-form">
            <label for="seedName">Name</label>
            <input type="text" id="seedName" required />
            <label for="seedContact">Email or phone</label>
            <input type="text" id="seedContact" required />
            <div class="actions">
              <button type="submit">Create invite</button>
            </div>
          </form>
          <div id="seed-message"></div>
        </div>
      `;
      window.scrollTo(0, scrollY);

      wireDancerRowHandlers(content, () => renderDashboard({ showLoading: false }));

      document.getElementById("seed-form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const name = document.getElementById("seedName").value;
        const contact = document.getElementById("seedContact").value;
        try {
          const token = await addDancerManually({ name, contact });
          await renderDashboard({ showLoading: false });
          document.getElementById("seed-message").innerHTML = `<div class="notice success">Created invite for ${escapeHtml(name)}: <span class="invite-link">${inviteUrl(token)}</span></div>`;
        } catch (err) {
          document.getElementById("seed-message").innerHTML = `<div class="notice error">${escapeHtml(err.message)}</div>`;
        }
      });
    }

    function renderSignedOut() {
      content.innerHTML = `
        <div class="card">
          <p>Sign in with the admin Google account to manage nominations.</p>
          <button id="signin">Sign in with Google</button>
        </div>
      `;
      document.getElementById("signin").addEventListener("click", () => signInAdmin().catch((err) => alert(err.message)));
    }

    function renderUnauthorized(email) {
      content.innerHTML = `
        <div class="notice error">Signed in as ${escapeHtml(email)}, which isn't the admin account.</div>
        <button id="signout" class="secondary">Sign out</button>
      `;
      document.getElementById("signout").addEventListener("click", () => signOutAdmin());
    }

    startCountdownTicker(content);

    if (MOCK_MODE) {
      who.textContent = "local preview";
      renderDashboard();
    } else {
      onAdminAuthChange(({ signedIn, isAdmin, email }) => {
        if (!signedIn) {
          who.textContent = "";
          renderSignedOut();
        } else if (!isAdmin) {
          who.textContent = email;
          renderUnauthorized(email);
        } else {
          who.innerHTML = `${escapeHtml(email)} &middot; <a href="#" id="signout-link">sign out</a>`;
          document.getElementById("signout-link")?.addEventListener("click", (e) => {
            e.preventDefault();
            signOutAdmin();
          });
          renderDashboard();
        }
      });
    }
  </script>
</body>
</html>
