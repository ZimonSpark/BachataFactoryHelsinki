<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Bachata Club Control Center</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .cc { max-width: 960px; margin: 0 auto; padding: 2.5rem 1rem 4rem; }
    .cc header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: .5rem 1rem; margin-bottom: 2rem; }
    .cc h1 { font-size: clamp(1.7rem, 5vw, 2.4rem); margin: 0; }
    .cc h2 { font-size: 1.3rem; margin: 2.5rem 0 1rem; }
    .cc .muted { color: var(--text-muted); font-size: .9rem; }
    .cc-grid { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fill, minmax(min(280px, 100%), 1fr)); }
    .cc-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 1.1rem 1.2rem; min-width: 0; }
    .cc-card h3 { margin: 0 0 .25rem; color: var(--text); font-size: 1.05rem; font-family: "Inter", system-ui, sans-serif; font-weight: 600; }
    .cc-card p { margin: .5rem 0; font-size: .92rem; }
    .cc-tag { display: inline-block; font-size: .72rem; letter-spacing: .06em; text-transform: uppercase; color: var(--gold-soft); border: 1px solid #3a3326; border-radius: 999px; padding: .1rem .55rem; }
    .cc-kv { display: grid; grid-template-columns: auto 1fr; gap: .2rem .8rem; font-size: .88rem; margin: .7rem 0; }
    .cc-kv dt { color: var(--text-muted); }
    .cc-kv dd { margin: 0; color: var(--text-body); }
    .cc a { color: var(--gold-soft); }
    .cc-links { display: flex; flex-wrap: wrap; gap: .4rem 1rem; font-size: .88rem; }
    .st { display: inline-flex; align-items: center; gap: .4rem; font-weight: 600; font-size: .85rem; }
    .st::before { content: ""; width: .6rem; height: .6rem; border-radius: 50%; background: currentColor; }
    .st-ok { color: var(--success); }
    .st-warning { color: var(--gold); }
    .st-error { color: var(--danger); }
    .st-none { color: var(--text-muted); }
    .cc-filter { display: flex; gap: .5rem; flex-wrap: wrap; margin-bottom: 1rem; }
    .cc-filter button { background: transparent; color: var(--text-body); border: 1px solid var(--border); border-radius: 999px; padding: .35rem .9rem; font: inherit; font-size: .85rem; cursor: pointer; }
    .cc-filter button[aria-pressed="true"] { background: var(--burgundy); border-color: var(--red-deep); color: var(--text); }
    .run { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; margin-bottom: .75rem; }
    .run summary { font-family: "Inter", system-ui, sans-serif; font-weight: 400; list-style: none; cursor: pointer; padding: .9rem 1.1rem; display: grid; grid-template-columns: auto 1fr; gap: .2rem 1rem; align-items: baseline; }
    .run summary::-webkit-details-marker { display: none; }
    .run .when { color: var(--text-muted); font-size: .85rem; grid-column: 1 / -1; }
    .run .sum { color: var(--text); font-size: .95rem; min-width: 0; overflow-wrap: anywhere; }
    .run ul { margin: 0; padding: 0 1.1rem 1rem 2.4rem; font-size: .9rem; }
    .run li { margin: .35rem 0; overflow-wrap: anywhere; }
    .kind { font-size: .72rem; text-transform: uppercase; letter-spacing: .05em; color: var(--text-muted); margin-right: .4rem; }
    .kind-created { color: var(--success); }
    .kind-updated { color: var(--gold-soft); }
    .kind-warning { color: var(--gold); }
    .kind-error { color: var(--danger); }
    .empty { color: var(--text-muted); font-style: italic; }
    .st-skipped { color: var(--text-muted); }
    .cc-tags { display: flex; gap: .35rem; flex-wrap: wrap; }
    .cc-tag.pf-instagram { color: #ef6fb6; border-color: #4a2238; }
    .cc-tag.pf-facebook { color: #7aa6ff; border-color: #22304a; }
    .cc-stats { display: flex; flex-wrap: wrap; gap: .5rem; margin: .6rem 0; }
    .cc-stat { background: #1f1f22; border: 1px solid var(--border); border-radius: 8px; padding: .35rem .6rem; font-size: .8rem; color: var(--text-muted); }
    .cc-stat b { display: block; color: var(--text); font-size: 1.05rem; font-variant-numeric: tabular-nums; }
    .run .mx { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: .3rem .9rem; font-size: .8rem; color: var(--text-muted); }
    .run .mx b { color: var(--text-body); font-variant-numeric: tabular-nums; }
    .cc-group { margin-top: 1.5rem; }
    .cc-group h3.gh { font-family: "Inter", system-ui, sans-serif; font-size: .8rem; letter-spacing: .08em; text-transform: uppercase; color: var(--text-muted); margin: 0 0 .7rem; }
    /* Follow timeline — dark-surface steps of the validated categorical palette */
    .fl-viz { --fl-back: #3987e5; --fl-wait: #85837d; --fl-unf: #d95926; --fl-grid: #2a2a2d; --fl-axis: #8f8d89;
      position: relative; background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 1.1rem 1.2rem 1rem; }
    .fl-sub { margin: -.5rem 0 1rem; }
    .fl-tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(140px, 100%), 1fr)); gap: .6rem; margin-bottom: 1rem; }
    .fl-tile { border: 1px solid var(--border); border-radius: 10px; padding: .55rem .75rem; }
    .fl-tile .k { display: flex; align-items: center; gap: .4rem; font-size: .78rem; color: var(--text-muted); }
    .fl-tile .v { font-size: 1.5rem; font-weight: 600; color: var(--text); font-variant-numeric: tabular-nums; line-height: 1.2; }
    .fl-tile .d { font-size: .78rem; color: var(--text-muted); }
    .fl-sw { width: .7rem; height: .7rem; border-radius: 3px; flex: none; }
    .fl-bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: .5rem 1rem; margin-bottom: .4rem; }
    .fl-legend { display: flex; flex-wrap: wrap; gap: .3rem 1rem; font-size: .82rem; color: var(--text-body); }
    .fl-legend span { display: inline-flex; align-items: center; gap: .4rem; }
    .fl-range { margin: 0; }
    .fl-chart { width: 100%; min-height: 220px; }
    .fl-chart svg { display: block; width: 100%; height: auto; overflow: visible; }
    .fl-chart text { font-family: "Inter", system-ui, sans-serif; font-size: 11px; fill: var(--fl-axis); font-variant-numeric: tabular-nums; }
    .fl-col:focus { outline: none; }
    .fl-col:focus-visible .fl-hit { stroke: var(--gold-soft); stroke-width: 1.5; }
    .fl-tip { position: absolute; pointer-events: none; background: #0f0f10; border: 1px solid var(--border); border-radius: 8px;
      padding: .5rem .65rem; font-size: .8rem; color: var(--text-body); min-width: 11rem; box-shadow: 0 6px 20px rgba(0,0,0,.45); z-index: 2; }
    .fl-tip b { color: var(--text); }
    .fl-tip .r { display: flex; align-items: center; gap: .45rem; justify-content: space-between; }
    .fl-tip .r span:first-child { display: inline-flex; align-items: center; gap: .4rem; }
    .fl-table { margin-top: .8rem; font-size: .85rem; }
    .fl-table summary { cursor: pointer; color: var(--gold-soft); font-family: "Inter", system-ui, sans-serif; font-size: .85rem; font-weight: 500; padding: 0; }
    .fl-table summary::after, .fl-table summary::before { font-size: .85rem; }
    .fl-table table { width: 100%; border-collapse: collapse; margin-top: .5rem; font-variant-numeric: tabular-nums; }
    .fl-table th, .fl-table td { text-align: right; padding: .3rem .5rem; border-bottom: 1px solid var(--border); }
    .fl-table th:first-child, .fl-table td:first-child { text-align: left; white-space: nowrap; }
    .fl-table th { color: var(--text-muted); font-weight: 500; }
    .fl-wrap { overflow-x: auto; }
    @media (min-width: 640px) { .run .when { grid-column: auto; } .run summary { grid-template-columns: 7.5rem 9rem 1fr; } }
  </style>
</head>
<body>
  <main class="cc">
    <header>
      <h1>Bachata Club Control Center</h1>
      <span class="muted" id="updated">Loading…</span>
    </header>

    <section aria-labelledby="tasks-h">
      <h2 id="tasks-h">Automatic tasks</h2>
      <div class="cc-grid" id="tasks"></div>
    </section>

    <section aria-labelledby="fl-h" id="fl-section" hidden>
      <h2 id="fl-h">Instagram follows, day by day</h2>
      <p class="muted fl-sub">Each bar is one day of the follow batch, split by what happened to those people since.</p>
      <div class="fl-viz">
        <div class="fl-tiles" id="fl-tiles"></div>
        <div class="fl-bar">
          <div class="fl-legend" id="fl-legend"></div>
          <div class="cc-filter fl-range" id="fl-range" role="group" aria-label="Time range"></div>
        </div>
        <div class="fl-chart" id="fl-chart"></div>
        <div class="fl-tip" id="fl-tip" role="status" hidden></div>
        <details class="fl-table"><summary>Show as table</summary><div id="fl-table"></div></details>
      </div>
    </section>

    <section aria-labelledby="runs-h">
      <h2 id="runs-h">Run history</h2>
      <div class="cc-filter" id="filter" role="group" aria-label="Filter runs by task"></div>
      <div id="runs"></div>
    </section>
  </main>

  <script>
    const fmt = (iso, withTime = true) => {
      if (!iso) return "—";
      const d = new Date(iso);
      return d.toLocaleString("en-GB", {
        timeZone: "Europe/Helsinki", weekday: "short", day: "numeric", month: "short", year: "numeric",
        ...(withTime ? { hour: "2-digit", minute: "2-digit" } : {})
      });
    };
    const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    const safeUrl = u => /^https:\/\//.test(u || "") ? u : null;
    const statusLabel = s => ({ ok: "OK", warning: "Warning", error: "Error", skipped: "Skipped" }[s] || "Not run yet");
    const st = s => `<span class="st st-${["ok", "warning", "error", "skipped"].includes(s) ? s : "none"}">${statusLabel(s)}</span>`;
    const statBoxes = o => o && Object.keys(o).length ? `<div class="cc-stats">${Object.entries(o).map(([k, v]) => `<span class="cc-stat"><b>${esc(v)}</b>${esc(k)}</span>`).join("")}</div>` : "";

    let data, filter = "all";

    function renderTasks() {
      const el = document.getElementById("tasks");
      const card = t => `
        <article class="cc-card">
          <div class="cc-tags"><span class="cc-tag">${esc(t.project)}</span>${t.platform ? `<span class="cc-tag pf-${esc(t.platform.toLowerCase())}">${esc(t.platform)}</span>` : ""}</div>
          <h3>${esc(t.name)}</h3>
          <p>${esc(t.description)}</p>
          ${statBoxes(t.stats)}
          <dl class="cc-kv">
            <dt>Schedule</dt><dd>${esc(t.schedule)}</dd>
            <dt>Last run</dt><dd>${fmt(t.lastRunAt)}</dd>
            <dt>Result</dt><dd>${st(t.lastStatus)}</dd>
          </dl>
          <div class="cc-links">${(t.links || []).filter(l => safeUrl(l.url)).map(l => `<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)}</a>`).join("")}</div>
        </article>`;
      const groups = [...new Set(data.tasks.map(t => t.platform || "Other"))];
      el.classList.remove("cc-grid");
      el.innerHTML = groups.map(g => `
        <div class="cc-group"><h3 class="gh">${esc(g)}</h3>
          <div class="cc-grid">${data.tasks.filter(t => (t.platform || "Other") === g).map(card).join("")}</div>
        </div>`).join("") || `<p class="empty">No tasks yet.</p>`;
    }

    function renderFilter() {
      const el = document.getElementById("filter");
      const opts = [{ id: "all", name: "All" }, ...data.tasks];
      el.innerHTML = opts.map(o => `<button type="button" data-id="${esc(o.id)}" aria-pressed="${o.id === filter}">${esc(o.name)}</button>`).join("");
      el.onclick = e => { const b = e.target.closest("button"); if (!b) return; filter = b.dataset.id; renderFilter(); renderRuns(); };
    }

    function renderRuns() {
      const names = Object.fromEntries(data.tasks.map(t => [t.id, t.name]));
      const runs = data.runs.filter(r => filter === "all" || r.taskId === filter);
      document.getElementById("runs").innerHTML = runs.map((r, i) => `
        <details class="run"${i === 0 ? " open" : ""}>
          <summary>
            ${st(r.status)}
            <span class="when">${fmt(r.startedAt)}${r.manual ? " · by hand" : ""}</span>
            <span class="sum"><span class="muted">${esc(names[r.taskId] || r.taskId)} — </span>${esc(r.summary)}</span>
            ${r.metrics && Object.keys(r.metrics).length ? `<span class="mx">${Object.entries(r.metrics).map(([k, v]) => `<span>${esc(k)} <b>${esc(v)}</b></span>`).join("")}</span>` : ""}
          </summary>
          ${(r.details || []).length ? `<ul>${r.details.map(d => `
            <li><span class="kind kind-${esc(d.kind)}">${esc(d.kind)}</span>${safeUrl(d.link) ? `<a href="${esc(d.link)}" target="_blank" rel="noopener">${esc(d.title)}</a>` : esc(d.title)}${d.note ? ` <span class="muted">— ${esc(d.note)}</span>` : ""}</li>`).join("")}</ul>` : ""}
        </details>`).join("") || `<p class="empty">No runs yet.</p>`;
    }

    /* ---------- Instagram follow timeline ---------- */
    const SEG = [
      { key: "followedBack", label: "Followed back", color: "var(--fl-back)" },
      { key: "waiting", label: "No follow-back yet", color: "var(--fl-wait)" },
      { key: "unfollowed", label: "Unfollowed by us", color: "var(--fl-unf)" }
    ];
    const DAILY_CAP = 60;
    let flRange = "30";
    const dayKey = d => d.toISOString().slice(0, 10);
    const helsinkiToday = () => new Date(new Date().toLocaleString("en-US", { timeZone: "Europe/Helsinki" }));
    const fmtDay = (iso, opts) => new Date(iso + "T12:00:00Z").toLocaleDateString("en-GB", { timeZone: "UTC", ...opts });
    const pct = (a, b) => b ? Math.round(100 * a / b) + "%" : "—";

    function flSeries() {
      const by = Object.fromEntries((data.instagram?.daily || []).map(d => [d.date, d]));
      const first = Object.keys(by).sort()[0];
      const t = helsinkiToday(); const end = new Date(Date.UTC(t.getFullYear(), t.getMonth(), t.getDate()));
      let start = flRange === "all" && first ? new Date(first + "T00:00:00Z") : new Date(end.getTime() - (Number(flRange) - 1) * 864e5);
      const out = [];
      for (let d = new Date(start); d <= end; d = new Date(d.getTime() + 864e5)) {
        const k = dayKey(d);
        out.push(by[k] || { date: k, followed: 0, followedBack: 0, waiting: 0, unfollowed: 0 });
      }
      return out;
    }

    function renderFollows() {
      const daily = data.instagram?.daily || [];
      const sec = document.getElementById("fl-section");
      if (!daily.length) { sec.hidden = true; return; }
      sec.hidden = false;
      const sw = c => `<span class="fl-sw" style="background:${c}"></span>`;
      const tot = daily.reduce((a, d) => { SEG.forEach(s => a[s.key] += d[s.key]); a.followed += d.followed; return a; }, { followed: 0, followedBack: 0, waiting: 0, unfollowed: 0 });
      document.getElementById("fl-tiles").innerHTML = `
        <div class="fl-tile"><div class="k">Followed</div><div class="v">${tot.followed}</div><div class="d">since ${fmtDay(daily[0].date, { day: "numeric", month: "short" })}</div></div>
        ${SEG.map(s => `<div class="fl-tile"><div class="k">${sw(s.color)}${s.label}</div><div class="v">${tot[s.key]}</div><div class="d">${pct(tot[s.key], tot.followed)} of followed</div></div>`).join("")}`;
      document.getElementById("fl-legend").innerHTML = SEG.map(s => `<span>${sw(s.color)}${s.label}</span>`).join("");
      const rg = document.getElementById("fl-range");
      rg.innerHTML = [["30", "30 days"], ["90", "90 days"], ["all", "All"]].map(([k, l]) => `<button type="button" data-r="${k}" aria-pressed="${flRange === k}">${l}</button>`).join("");
      rg.onclick = e => { const b = e.target.closest("button"); if (!b) return; flRange = b.dataset.r; renderFollows(); };
      document.getElementById("fl-table").innerHTML = `<div class="fl-wrap"><table><thead><tr><th>Day</th><th>Followed</th>${SEG.map(s => `<th>${s.label}</th>`).join("")}<th>Follow-back rate</th></tr></thead><tbody>${daily.slice().reverse().map(d => `<tr><td>${fmtDay(d.date, { weekday: "short", day: "numeric", month: "short" })}</td><td>${d.followed}</td>${SEG.map(s => `<td>${d[s.key]}</td>`).join("")}<td>${pct(d.followedBack, d.followed)}</td></tr>`).join("")}</tbody></table></div>`;
      drawFollowChart();
    }

    function drawFollowChart() {
      const box = document.getElementById("fl-chart");
      const series = flSeries();
      const W = Math.max(280, box.clientWidth), H = W < 520 ? 220 : 260;
      const L = 30, R = 8, T = 14, B = 26;
      const maxV = Math.max(DAILY_CAP, ...series.map(d => d.followed));
      const step = maxV <= 60 ? 20 : maxV <= 120 ? 40 : 50;
      const yMax = Math.ceil(maxV / step) * step;
      const y = v => T + (H - T - B) * (1 - v / yMax);
      const n = series.length, slot = (W - L - R) / n;
      const bw = Math.max(2, Math.min(28, slot * 0.68));
      const x = i => L + slot * i + (slot - bw) / 2;
      let g = "";
      for (let v = 0; v <= yMax; v += step) g += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--fl-grid)" stroke-width="1"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${v}</text>`;
      // daily cap reference
      g += `<line x1="${L}" x2="${W - R}" y1="${y(DAILY_CAP)}" y2="${y(DAILY_CAP)}" stroke="var(--fl-axis)" stroke-width="1" stroke-dasharray="3 4"/><text x="${W - R}" y="${y(DAILY_CAP) - 5}" text-anchor="end">daily cap ${DAILY_CAP}</text>`;
      // x labels: every Monday (or every ~7th day when zoomed out), never crowded
      const every = Math.max(1, Math.ceil(56 / slot));
      series.forEach((d, i) => {
        const dt = new Date(d.date + "T12:00:00Z");
        const isMon = dt.getUTCDay() === 1;
        if ((every <= 7 ? isMon : i % every === 0)) g += `<text x="${L + slot * i + slot / 2}" y="${H - 8}" text-anchor="middle">${fmtDay(d.date, { day: "numeric", month: "short" })}</text>`;
      });
      series.forEach((d, i) => {
        let acc = 0, segs = "";
        const parts = SEG.filter(s => d[s.key] > 0);
        parts.forEach((s, j) => {
          const v = d[s.key], y0 = y(acc), y1 = y(acc + v), top = j === parts.length - 1;
          const gap = j > 0 ? 2 : 0; // 2px surface gap between stacked segments
          const h = Math.max(1, y0 - y1 - gap), yy = y1;
          const r = top ? Math.min(4, bw / 2, h) : 0;
          segs += r ? `<path d="M${x(i)},${yy + h} V${yy + r} Q${x(i)},${yy} ${x(i) + r},${yy} H${x(i) + bw - r} Q${x(i) + bw},${yy} ${x(i) + bw},${yy + r} V${yy + h} Z" fill="${s.color}"/>`
                    : `<rect x="${x(i)}" y="${yy}" width="${bw}" height="${h}" fill="${s.color}"/>`;
          acc += v;
        });
        const label = `${fmtDay(d.date, { weekday: "short", day: "numeric", month: "short" })}: ${d.followed} followed` + (d.followed ? `, ${d.followedBack} followed back, ${d.waiting} no follow-back yet, ${d.unfollowed} unfollowed` : "");
        g += `<g class="fl-col" tabindex="0" data-i="${i}" role="img" aria-label="${esc(label)}"><rect class="fl-hit" x="${L + slot * i}" y="${T}" width="${slot}" height="${H - T - B}" fill="transparent"/>${segs}</g>`;
      });
      g += `<line x1="${L}" x2="${W - R}" y1="${y(0)}" y2="${y(0)}" stroke="var(--fl-axis)" stroke-width="1"/>`;
      box.innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" aria-label="Follows per day, stacked by outcome">${g}</svg>`;

      const tip = document.getElementById("fl-tip"), viz = box.parentElement;
      const show = (el) => {
        const d = series[+el.dataset.i];
        tip.innerHTML = `<b>${fmtDay(d.date, { weekday: "long", day: "numeric", month: "short" })}</b><div class="r"><span>Followed</span><b>${d.followed}</b></div>` +
          (d.followed ? SEG.map(s => `<div class="r"><span><span class="fl-sw" style="background:${s.color}"></span>${s.label}</span><b>${d[s.key]}</b></div>`).join("") + `<div class="r"><span>Follow-back rate</span><b>${pct(d.followedBack, d.followed)}</b></div>` : `<div class="muted">No follows this day</div>`);
        tip.hidden = false;
        const vr = viz.getBoundingClientRect(), er = el.getBoundingClientRect();
        let left = er.left - vr.left + er.width / 2 - tip.offsetWidth / 2;
        left = Math.max(8, Math.min(left, vr.width - tip.offsetWidth - 8));
        tip.style.left = left + "px";
        tip.style.top = (box.offsetTop + 4) + "px";
        box.querySelectorAll(".fl-col").forEach(c => c.style.opacity = c === el ? 1 : .55);
      };
      const hide = () => { tip.hidden = true; box.querySelectorAll(".fl-col").forEach(c => c.style.opacity = 1); };
      box.querySelectorAll(".fl-col").forEach(c => {
        c.addEventListener("mouseenter", () => show(c)); c.addEventListener("focus", () => show(c));
        c.addEventListener("click", () => show(c));
      });
      box.onmouseleave = hide; box.addEventListener("focusout", e => { if (!box.contains(e.relatedTarget)) hide(); });
    }
    let flResizeT;
    window.addEventListener("resize", () => { clearTimeout(flResizeT); flResizeT = setTimeout(() => data && data.instagram && drawFollowChart(), 120); });

    fetch("data/control-center.json?t=" + Date.now(), { cache: "no-store" })
      .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(d => {
        data = d;
        document.getElementById("updated").textContent = "Updated " + fmt(d.updatedAt);
        renderTasks(); renderFollows(); renderFilter(); renderRuns();
      })
      .catch(err => { document.getElementById("updated").textContent = "Could not load data (" + err.message + ")"; });
  </script>
</body>
</html>
